apiVersion: apps/v1
kind: Deployment
metadata:
  name: emuse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emuse
  template:
    metadata:
      labels:
        app: emuse
    spec:
      containers:
        - name: emuse
          image: nikhel/emuse-amd:latest
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: emuse-service
spec:
  selector:
    app: emuse
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emuse-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: emuse-service
            port:
              number: 80
