name: EMUSE CI/CD

# ──────────────────────────────────────────────────────────────────────────────
# Triggers: every push to every branch, and every pull request against main.
# The build-and-push job only runs when lint AND smoke-test both pass.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR so stale runs don't waste
# runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nikhel/emuse

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 – Lint & static analysis (advisory — never blocks the pipeline)
  #
  # ruff and bandit run with `|| true` so warnings never fail the job.
  # Output is captured into a markdown report and uploaded as a downloadable
  # Actions artifact (visible in the GitHub Actions UI for 90 days).
  # ruff also emits ::warning:: annotations so findings appear inline on the
  # commit/PR diff view — purely informational.
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Security Check (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff & bandit — capture to report
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          mkdir -p .linter_suggestions

          {
            echo "# Linter Suggestions"
            echo ""
            echo "**Branch:** \`${{ github.ref_name }}\`  "
            echo "**Commit:** \`${SHORT_SHA}\` — ${{ github.event.head_commit.message }}"
            echo "**Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "---"
            echo ""
            echo "## ruff — style & lint"
            echo ""
            echo '```'
            ruff check --output-format=text main.py 2>&1 || true
            echo '```'
            echo ""
            echo "## ruff — format diff"
            echo ""
            echo '```diff'
            ruff format --diff main.py 2>&1 || true
            echo '```'
            echo ""
            echo "## bandit — security scan"
            echo ""
            echo '```'
            bandit -ll -ii main.py 2>&1 || true
            echo '```'
          } > ".linter_suggestions/report-${SHORT_SHA}.md"

          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Annotate PR / commit with ruff inline warnings
        # github output format writes ::warning:: markers — shows up in the
        # diff view and summary tab, but never causes a failure.
        run: ruff check --output-format=github main.py || true

      - name: Upload suggestions as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: linter-suggestions-${{ env.SHORT_SHA }}
          path: .linter_suggestions/
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 – Smoke test
  # Installs dependencies and verifies the Streamlit process starts and the
  # health endpoint responds on port 8501.
  # The data files (epoch_99.pt, all_sbid_image_features.pt, *.pkl) are
  # downloaded at runtime via gdown inside load_model_and_data(); this job
  # lets that happen — it typically takes 5–15 min depending on Drive speed.
  # ────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (app starts on :8501)
    runs-on: ubuntu-latest
    needs: lint            # don't bother booting the app if lint fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Start Streamlit in background
        run: |
          streamlit run main.py \
            --server.headless true \
            --server.port 8501 \
            --server.address 0.0.0.0 \
            &
          echo "STREAMLIT_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for app to become healthy
        # Poll /_stcore/health up to 30 minutes (model download can be slow on
        # GitHub's network; adjust --max-time if Drive is fast for you).
        run: |
          echo "Waiting for Streamlit health endpoint..."
          timeout 1800 bash -c \
            'until curl -sf http://localhost:8501/_stcore/health; do
               echo "  still waiting..."; sleep 15;
             done'
          echo "✅ Streamlit is healthy"

      - name: Stop Streamlit
        if: always()
        run: kill "$STREAMLIT_PID" 2>/dev/null || true

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 – Build & push multi-platform Docker image
  # Only runs after lint AND smoke-test both succeed.
  # Image tag: 1.0.<github.run_number>  (e.g. 1.0.42)
  # Also tags :latest on every push so your k8s manifest can track either.
  #
  # Required GitHub secrets (set in repo → Settings → Secrets & variables):
  #   DOCKERHUB_USERNAME  – your Docker Hub username (nikhel)
  #   DOCKERHUB_TOKEN     – Docker Hub access token (NOT your password;
  #                         create one at hub.docker.com → Security)
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: [lint, smoke-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Derive the semver tag: 1.0.<run_number>
      # Also expose the short SHA for traceability.
      - name: Set image tags
        id: tags
        run: |
          VERSION="1.0.${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::8}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "📦 Image version: ${VERSION}  sha: ${SHORT_SHA}"

      - name: Set up QEMU (for cross-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Two tags per push:
          #   nikhel/emuse:1.0.42          ← pin this in your k8s manifest
          #   nikhel/emuse:latest          ← always points to the newest build
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          # Inline cache speeds up subsequent builds significantly
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Bake metadata (git SHA, build date, version) into image labels
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Print image digest
        run: |
          echo "✅ Pushed: ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}"
          echo "   Also tagged: ${{ env.IMAGE_NAME }}:latest"
          echo "   To update your k8s manifest, change the image tag to:"
          echo "   ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}"
